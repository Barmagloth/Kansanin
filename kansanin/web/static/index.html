<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kansanin Web Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
:root {
  --sev-critical: #dc2626;
  --sev-high: #ea580c;
  --sev-medium: #ca8a04;
  --sev-low: #2563eb;
  --sev-info: #6b7280;
  --tree-width: 400px;
  --detail-width: 700px;
  --toolbar-height: 56px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, sans-serif;
  height: 100vh;
  overflow: hidden;
}

/* ── Toolbar ─────────────────────────────────────────────── */
#toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: var(--pico-primary-background);
  color: white;
  height: var(--toolbar-height);
  flex-shrink: 0;
}
#toolbar h1 {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 600;
  white-space: nowrap;
}
#toolbar .spacer { flex: 1; }
#toolbar button {
  padding: 6px 14px;
  font-size: 0.85rem;
  margin: 0;
  border: 1px solid rgba(255,255,255,0.3);
  background: transparent;
  color: white;
  cursor: pointer;
  border-radius: 4px;
}
#toolbar button:hover { background: rgba(255,255,255,0.15); }
#toolbar button.primary-btn {
  background: rgba(255,255,255,0.2);
  border-color: rgba(255,255,255,0.5);
}
#summary-bar {
  font-size: 0.85rem;
  opacity: 0.9;
  white-space: nowrap;
}
.toggle-group {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.8rem;
}
.toggle-group label {
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 3px;
}
.toggle-group input[type="checkbox"] {
  margin: 0;
  width: 16px;
  height: 16px;
}

/* ── Main layout ─────────────────────────────────────────── */
#app {
  display: flex;
  height: calc(100vh - var(--toolbar-height));
}

/* ── Left: File tree ─────────────────────────────────────── */
#file-panel {
  width: var(--tree-width);
  min-width: 200px;
  max-width: 50vw;
  border-right: 1px solid var(--pico-muted-border-color);
  display: flex;
  flex-direction: column;
  background: var(--pico-card-background-color);
  flex-shrink: 0;
}

/* ── Drag resize handles ────────────────────────────────── */
.resize-handle {
  width: 5px;
  cursor: col-resize;
  background: transparent;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.resize-handle:hover,
.resize-handle.dragging {
  background: var(--pico-primary);
  opacity: 0.4;
}
#file-panel-header {
  padding: 10px 12px;
  border-bottom: 1px solid var(--pico-muted-border-color);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
#file-panel-header h3 {
  margin: 0;
  font-size: 0.9rem;
  flex: 1;
}
#file-panel-header button {
  padding: 4px 10px;
  font-size: 0.75rem;
  margin: 0;
}
#file-tree {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}
.tree-item {
  display: flex;
  align-items: center;
  padding: 3px 8px 3px 0;
  cursor: pointer;
  font-size: 0.82rem;
  white-space: nowrap;
  user-select: none;
}
.tree-item:hover { background: var(--pico-primary-focus); }
.tree-item.selected { background: var(--pico-primary-focus); font-weight: 600; }
.tree-icon {
  width: 20px;
  text-align: center;
  flex-shrink: 0;
  font-size: 0.75rem;
}
.tree-checkbox {
  margin: 0 4px 0 0;
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}
.tree-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.tree-badge {
  margin-left: 6px;
  background: var(--sev-high);
  color: white;
  border-radius: 10px;
  padding: 0 6px;
  font-size: 0.7rem;
  font-weight: 600;
  min-width: 18px;
  text-align: center;
}
.tree-children { display: none; }
.tree-children.open { display: block; }
.tree-toggle {
  width: 16px;
  text-align: center;
  flex-shrink: 0;
  cursor: pointer;
  color: var(--pico-muted-color);
}

/* ── Center: Findings table ──────────────────────────────── */
#findings-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
#filter-bar {
  padding: 8px 12px;
  border-bottom: 1px solid var(--pico-muted-border-color);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.severity-filters {
  display: flex;
  gap: 6px;
}
.sev-chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 0.75rem;
  cursor: pointer;
  border: 1px solid transparent;
  opacity: 0.5;
  user-select: none;
}
.sev-chip.active { opacity: 1; border-color: currentColor; }
.sev-chip[data-sev="critical"] { color: var(--sev-critical); background: #fef2f2; }
.sev-chip[data-sev="high"]     { color: var(--sev-high); background: #fff7ed; }
.sev-chip[data-sev="medium"]   { color: var(--sev-medium); background: #fefce8; }
.sev-chip[data-sev="low"]      { color: var(--sev-low); background: #eff6ff; }
.sev-chip[data-sev="info"]     { color: var(--sev-info); background: #f3f4f6; }

#search-input {
  padding: 4px 10px;
  font-size: 0.82rem;
  border-radius: 4px;
  border: 1px solid var(--pico-muted-border-color);
  flex: 1;
  min-width: 120px;
  max-width: 250px;
  margin: 0;
}

#findings-list {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}

.file-group-header {
  padding: 8px 12px;
  background: var(--pico-muted-border-color);
  font-weight: 600;
  font-size: 0.82rem;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 6px;
  position: sticky;
  top: 0;
  z-index: 1;
}
.file-group-header .count {
  font-weight: 400;
  color: var(--pico-muted-color);
  font-size: 0.75rem;
}

.finding-row {
  display: grid;
  grid-template-columns: 28px 52px min-content minmax(100px, auto) 1fr;
  gap: 8px;
  padding: 6px 12px;
  border-bottom: 1px solid var(--pico-muted-border-color);
  cursor: pointer;
  align-items: center;
  font-size: 0.82rem;
}
.finding-row:hover { background: var(--pico-primary-focus); }
.finding-row.selected { background: var(--pico-primary-focus); outline: 2px solid var(--pico-primary); }

.sev-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}
.sev-dot.critical { background: var(--sev-critical); }
.sev-dot.high     { background: var(--sev-high); }
.sev-dot.medium   { background: var(--sev-medium); }
.sev-dot.low      { background: var(--sev-low); }
.sev-dot.info     { background: var(--sev-info); }

.finding-id {
  font-family: monospace;
  font-size: 0.78rem;
  font-weight: 600;
}
.finding-class {
  font-size: 0.78rem;
  color: var(--pico-muted-color);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.finding-snippet {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--pico-color);
}

/* empty + loading states */
.empty-state, .loading-state {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--pico-muted-color);
  font-size: 0.95rem;
  text-align: center;
  padding: 40px;
}
.loading-state::before {
  content: "";
  width: 20px;
  height: 20px;
  border: 2px solid var(--pico-muted-color);
  border-top-color: var(--pico-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Right: Detail panel ─────────────────────────────────── */
#detail-panel {
  width: var(--detail-width);
  min-width: 260px;
  max-width: 70vw;
  border-left: 1px solid var(--pico-muted-border-color);
  overflow-y: auto;
  padding: 16px;
  background: var(--pico-card-background-color);
  flex-shrink: 0;
}
#detail-panel.empty {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--pico-muted-color);
}
.detail-section {
  margin-bottom: 16px;
}
.detail-section h4 {
  margin: 0 0 6px 0;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--pico-muted-color);
}
.detail-section p, .detail-section pre {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.5;
}
.detail-section pre {
  background: var(--pico-muted-border-color);
  padding: 10px;
  border-radius: 6px;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 0.8rem;
}
.detail-meta {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 12px;
  font-size: 0.82rem;
}
.detail-meta dt {
  color: var(--pico-muted-color);
  font-weight: 500;
}
.detail-meta dd { margin: 0; }

.sev-tag {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
}
.sev-tag.critical { background: #fef2f2; color: var(--sev-critical); }
.sev-tag.high     { background: #fff7ed; color: var(--sev-high); }
.sev-tag.medium   { background: #fefce8; color: var(--sev-medium); }
.sev-tag.low      { background: #eff6ff; color: var(--sev-low); }
.sev-tag.info     { background: #f3f4f6; color: var(--sev-info); }

.remediation-box {
  background: #f0fdf4;
  border-left: 3px solid #22c55e;
  padding: 8px 12px;
  border-radius: 0 6px 6px 0;
  font-size: 0.82rem;
}

/* ── Detail panel tabs ─────────────────────────────────── */
.detail-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 12px;
  border-bottom: 2px solid var(--pico-muted-border-color);
}
.detail-tab {
  padding: 6px 16px;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--pico-muted-color);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
}
.detail-tab.active {
  color: var(--pico-primary);
  border-bottom-color: var(--pico-primary);
}
.detail-tab:hover { color: var(--pico-color); }

/* ── Source viewer ──────────────────────────────────────── */
/* source/detail toggled via inline style.display in JS */

.source-viewer {
  font-family: monospace;
  font-size: 0.78rem;
  line-height: 1.6;
  overflow: auto;
  max-height: calc(100vh - var(--toolbar-height) - 80px);
  border: 1px solid var(--pico-muted-border-color);
  border-radius: 6px;
  background: #fafafa;
}
.source-viewer table {
  border-collapse: collapse;
  width: 100%;
  margin: 0;
}
.source-viewer td {
  padding: 0 8px;
  vertical-align: top;
  white-space: pre-wrap;
  word-break: break-word;
}
.source-viewer .line-no {
  width: 1%;
  white-space: nowrap;
  text-align: right;
  color: #999;
  user-select: none;
  padding-right: 12px;
  border-right: 1px solid #e5e7eb;
  background: #f3f4f6;
}
.source-viewer .line-text { padding-left: 12px; }
.source-viewer tr.highlight-line { background: #fef9c3; }
.source-viewer mark {
  background: #fbbf24;
  color: inherit;
  border-radius: 2px;
  padding: 0 1px;
}

/* ── Line badge in finding row ─────────────────────────── */
.line-badge {
  font-family: monospace;
  font-size: 0.72rem;
  color: var(--pico-muted-color);
  text-align: right;
}

/* ── Suppressed findings ──────────────────────────────── */
.finding-row.suppressed {
  opacity: 0.55;
  background: repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 8px,
    rgba(0,0,0,0.015) 8px,
    rgba(0,0,0,0.015) 16px
  );
}
.finding-row.suppressed .finding-snippet {
  text-decoration: line-through;
}
.finding-row.suppressed:hover { opacity: 0.75; }
.finding-row.suppressed.selected { opacity: 0.85; }

.suppressed-badge {
  display: inline-block;
  padding: 0 5px;
  border-radius: 3px;
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  background: #e5e7eb;
  color: #6b7280;
  letter-spacing: 0.3px;
}

/* ── Allowlist form ───────────────────────────────────── */
.allowlist-section {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 2px solid var(--pico-muted-border-color);
}
.allowlist-section h4 {
  margin: 0 0 10px 0;
  font-size: 0.82rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.scope-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
}
.scope-badge.document { background: #dbeafe; color: #1d4ed8; }
.scope-badge.project  { background: #fef3c7; color: #92400e; }
.scope-badge.global   { background: #fce7f3; color: #9d174d; }

.al-form-group {
  margin-bottom: 10px;
}
.al-form-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--pico-muted-color);
  margin-bottom: 2px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.al-form-group input,
.al-form-group textarea {
  width: 100%;
  padding: 6px 8px;
  font-size: 0.82rem;
  border: 1px solid var(--pico-muted-border-color);
  border-radius: 4px;
  font-family: inherit;
  margin: 0;
}
.al-form-group textarea {
  min-height: 60px;
  resize: vertical;
}
.al-form-group input[readonly],
.al-form-group textarea[readonly] {
  background: var(--pico-muted-border-color);
  opacity: 0.8;
  cursor: default;
}
.al-submit-btn {
  padding: 6px 16px;
  font-size: 0.82rem;
  font-weight: 500;
  background: var(--pico-primary);
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 4px;
}
.al-submit-btn:hover { opacity: 0.9; }
.al-submit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.al-status {
  font-size: 0.78rem;
  margin-top: 6px;
}
.al-status.success { color: #16a34a; }
.al-status.error   { color: var(--sev-critical); }
#locale-select {
  padding: 4px 8px;
  font-size: 0.78rem;
  font-weight: 600;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 4px;
  background: transparent;
  color: white;
  cursor: pointer;
  margin: 0;
  width: auto;
  min-width: 0;
  flex-shrink: 0;
}
#locale-select option {
  background: #1e3a5f;
  color: white;
}
/* ── Confidence blocks ──────────────────────────────────── */
.conf-blocks {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.conf-blocks .conf-num {
  font-weight: 600;
  font-size: 0.82rem;
  margin-right: 2px;
}
.conf-block {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  border: 1px solid #93c5fd;
}
.conf-block.filled { background: #3b82f6; border-color: #3b82f6; }
.conf-block.empty  { background: transparent; }
</style>
</head>
<body>

<!-- ── Toolbar ────────────────────────────────────────────── -->
<div id="toolbar">
  <h1>Kansanin</h1>
  <span id="summary-bar">Select files and press Scan</span>
  <div class="spacer"></div>
  <div class="toggle-group">
    <label><input type="checkbox" id="toggle-nlp"> NLP</label>
    <label><input type="checkbox" id="toggle-llm"> LLM</label>
  </div>
  <button id="btn-scan" class="primary-btn">Scan</button>
  <button id="btn-clear">Clear</button>
  <button id="btn-export">Export JSON</button>
  <select id="locale-select" onchange="setLocale(this.value)">
    <option value="en">EN</option>
    <option value="ru">RU</option>
  </select>
</div>

<!-- ── Main layout ───────────────────────────────────────── -->
<div id="app">

  <!-- Left: File tree -->
  <div id="file-panel">
    <div id="file-panel-header">
      <h3 id="root-label" title="">Files</h3>
      <button id="btn-change-root" title="Change root directory">&#x1F4C2;</button>
      <button id="btn-select-all" title="Select all files">All</button>
      <button id="btn-select-none" title="Deselect all">None</button>
    </div>
    <div id="file-tree">
      <div class="loading-state">Loading files...</div>
    </div>
  </div>

  <div class="resize-handle" id="resize-left"></div>

  <!-- Center: Findings -->
  <div id="findings-panel">
    <div id="filter-bar">
      <div class="severity-filters">
        <span class="sev-chip active" data-sev="critical">&#x1F534; Critical</span>
        <span class="sev-chip active" data-sev="high">&#x1F7E0; High</span>
        <span class="sev-chip active" data-sev="medium">&#x1F7E1; Medium</span>
        <span class="sev-chip active" data-sev="low">&#x1F535; Low</span>
        <span class="sev-chip active" data-sev="info">&#x26AA; Info</span>
      </div>
      <input type="text" id="search-input" placeholder="Search findings...">
      <label style="display:flex;align-items:center;gap:4px;font-size:0.78rem;cursor:pointer;white-space:nowrap;margin:0">
        <input type="checkbox" id="toggle-suppressed" style="margin:0;width:14px;height:14px"> Suppressed
      </label>
    </div>
    <div id="findings-list">
      <div class="empty-state">Select files and press Scan to start audit</div>
    </div>
  </div>

  <div class="resize-handle" id="resize-right"></div>

  <!-- Right: Detail / Source -->
  <div id="detail-panel" class="empty">
    <span>Click a finding to see details</span>
  </div>

</div>

function t(key) { return (_I18N[state.locale] || _I18N.en)[key] || key; }

function setLocale(lang) {
  state.locale = lang;
  localStorage.setItem('kansanin-locale', lang);
  document.getElementById('locale-select').value = lang;
  renderAll();
}

function renderAll() {
  document.getElementById('btn-scan').textContent = t('scan');
  document.getElementById('btn-clear').textContent = t('clear');
  document.getElementById('btn-export').textContent = t('exportJson');
  document.getElementById('btn-change-root').title = t('changeRoot');
  document.getElementById('btn-select-all').textContent = t('selectAll');
  document.getElementById('btn-select-all').title = t('selectAllTitle');
  document.getElementById('btn-select-none').textContent = t('deselectAll');
  document.getElementById('btn-select-none').title = t('deselectAllTitle');
  document.getElementById('search-input').placeholder = t('searchPlaceholder');
  document.querySelectorAll('.sev-chip').forEach(chip => {
    const sev = chip.dataset.sev;
    const icon = chip.innerHTML.split(' ')[0];
    chip.innerHTML = icon + ' ' + t(sev);
  });
  const suppLabel = document.getElementById('toggle-suppressed').parentElement;
  suppLabel.childNodes[suppLabel.childNodes.length - 1].textContent = ' ' + t('suppressed');
  document.querySelector('#file-panel-header h3').textContent = t('files');
  renderFileTree();
  renderFindings();
  renderDetail();
  renderSummary();
}

// ── API helpers ──────────────────────────────────────────────────────────────
async function apiGet(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

async function apiPost(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

// ── File tree ────────────────────────────────────────────────────────────────
function renderTreeNode(node, depth = 0) {
  const indent = depth * 16 + 8;

  if (node.type === 'dir') {
    const isOpen = true;  // default open
    let html = `<div class="tree-item" style="padding-left:${indent}px" data-dir="${esc(node.path)}">`;
    html += `<span class="tree-toggle">${isOpen ? '&#x25BE;' : '&#x25B8;'}</span>`;
    html += `<span class="tree-icon">&#x1F4C1;</span>`;
    html += `<span class="tree-label">${esc(node.name)}</span>`;
    html += `</div>`;
    html += `<div class="tree-children${isOpen ? ' open' : ''}" data-dir-children="${esc(node.path)}">`;
    for (const child of node.children || []) {
      html += renderTreeNode(child, depth + 1);
    }
    html += `</div>`;
    return html;
  }

  // file
  const checked = state.selectedFiles.has(node.path) ? 'checked' : '';
  const count = state.findingCounts[node.path] || 0;
  let html = `<div class="tree-item" style="padding-left:${indent}px" data-file="${esc(node.path)}">`;
  html += `<input type="checkbox" class="tree-checkbox" data-path="${esc(node.path)}" ${checked}>`;
  html += `<span class="tree-icon">&#x1F4C4;</span>`;
  html += `<span class="tree-label">${esc(node.name)}</span>`;
  if (count > 0) html += `<span class="tree-badge">${count}</span>`;
  html += `</div>`;
  return html;
}

function renderFileTree() {
  const el = document.getElementById('file-tree');
  if (!state.fileTree.length) {
    el.innerHTML = '<div class="empty-state">' + t('noDocuments') + '</div>';
    return;
  }
  let html = '';
  for (const node of state.fileTree) {
    html += renderTreeNode(node, 0);
  }
  el.innerHTML = html;

  // Event: toggle dirs
  el.querySelectorAll('.tree-item[data-dir]').forEach(item => {
    item.addEventListener('click', () => {
      const dirPath = item.dataset.dir;
      const children = el.querySelector(`[data-dir-children="${CSS.escape(dirPath)}"]`);
      if (children) {
        children.classList.toggle('open');
        const toggle = item.querySelector('.tree-toggle');
        toggle.innerHTML = children.classList.contains('open') ? '&#x25BE;' : '&#x25B8;';
      }
    });
  });

  // Event: checkboxes
  el.querySelectorAll('.tree-checkbox').forEach(cb => {
    cb.addEventListener('change', (e) => {
      e.stopPropagation();
      const path = cb.dataset.path;
      if (cb.checked) state.selectedFiles.add(path);
      else state.selectedFiles.delete(path);
    });
  });

  // Event: click file row (toggle checkbox)
  el.querySelectorAll('.tree-item[data-file]').forEach(item => {
    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('tree-checkbox')) return;
      const cb = item.querySelector('.tree-checkbox');
      cb.checked = !cb.checked;
      cb.dispatchEvent(new Event('change'));
    });
  });
}

function collectAllFiles(nodes) {
  const files = [];
  for (const n of nodes) {
    if (n.type === 'file') files.push(n.path);
    else if (n.children) files.push(...collectAllFiles(n.children));
  }
  return files;
}

// ── Findings list ────────────────────────────────────────────────────────────
function getFilteredFindings() {
  if (!state.scanResult) return [];
  const results = [];
  for (const fileResult of state.scanResult.files) {
    // Active findings
    const filtered = fileResult.findings.filter(f => {
      if (!state.activeSeverities.has(f.severity)) return false;
      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        const searchable = `${f.defect_id} ${f.defect_class} ${f.evidence_text} ${f.message} ${f.section_heading}`.toLowerCase();
        if (!searchable.includes(q)) return false;
      }
      return true;
    });

    // Suppressed findings (when toggle is on)
    let suppressedFiltered = [];
    if (state.showSuppressed && fileResult.suppressed) {
      suppressedFiltered = fileResult.suppressed.filter(s => {
        const f = s.finding;
        if (!state.activeSeverities.has(f.severity)) return false;
        if (state.searchQuery) {
          const q = state.searchQuery.toLowerCase();
          const searchable = `${f.defect_id} ${f.defect_class} ${f.evidence_text} ${f.message} ${f.section_heading}`.toLowerCase();
          if (!searchable.includes(q)) return false;
        }
        return true;
      }).map(s => {
        // Attach suppression metadata to the finding for rendering
        const f = { ...s.finding, _is_suppressed: true, _allowlist_entry: s.entry };
        return f;
      });
    }

    const all = [...filtered, ...suppressedFiltered];
    if (all.length > 0) {
      results.push({ path: fileResult.path, findings: all });
    }
  }
  return results;
}

function renderFindings() {
  const el = document.getElementById('findings-list');
  const groups = getFilteredFindings();

  if (!state.scanResult) {
    el.innerHTML = '<div class="empty-state">' + t('emptyState') + '</div>';
    return;
  }

  if (groups.length === 0) {
    el.innerHTML = '<div class="empty-state">' + t('noMatch') + '</div>';
    return;
  }

  let html = '';
  for (const group of groups) {
    const fname = group.path.split(/[\\/]/).pop();
    html += `<div class="file-group-header" data-group="${esc(group.path)}">`;
    html += `&#x1F4C4; ${esc(fname)} <span class="count">(${group.findings.length})</span>`;
    html += `</div>`;
    html += `<div class="file-group-body" data-group-body="${esc(group.path)}">`;
    for (let i = 0; i < group.findings.length; i++) {
      const f = group.findings[i];
      // Stable ID: defect_id + sentence_id + span (survives filter changes)
      const fid = `${group.path}::${f.defect_id}::${f.sentence_id}::${f.evidence_span}`;
      const sel = (state.selectedFinding && state.selectedFinding._stableId === fid) ? ' selected' : '';
      const suppCls = f._is_suppressed ? ' suppressed' : '';
      const lineLabel = f.line ? `L${f.line}` : '';
      html += `<div class="finding-row${sel}${suppCls}" data-fid="${esc(fid)}" data-file="${esc(group.path)}" data-idx="${i}">`;
      if (f._is_suppressed) {
        html += `<span class="suppressed-badge">${t('suppBadge')}</span>`;
      } else {
        html += `<span class="sev-dot ${f.severity}"></span>`;
      }
      html += `<span class="finding-id">${esc(f.defect_id)}</span>`;
      html += `<span class="line-badge">${esc(lineLabel)}</span>`;
      html += `<span class="finding-class">${esc(f.defect_class)}</span>`;
      html += `<span class="finding-snippet">${esc(truncate(f.evidence_text, 80))}</span>`;
      html += `</div>`;
    }
    html += `</div>`;
  }
  el.innerHTML = html;

  // Event: click finding row
  el.querySelectorAll('.finding-row').forEach(row => {
    row.addEventListener('click', () => {
      const filePath = row.dataset.file;
      const idx = parseInt(row.dataset.idx);
      const group = groups.find(g => g.path === filePath);
      if (group) {
        const finding = group.findings[idx];
        finding._stableId = row.dataset.fid;
        finding._file_path = group.path;  // attach group-level path as fallback
        state.selectedFinding = finding;
        renderFindings();
        renderDetail();
      }
    });
  });

  // Event: toggle file group
  el.querySelectorAll('.file-group-header').forEach(header => {
    header.addEventListener('click', () => {
      const gpath = header.dataset.group;
      const body = el.querySelector(`[data-group-body="${CSS.escape(gpath)}"]`);
      if (body) body.style.display = body.style.display === 'none' ? '' : 'none';
    });
  });
}

// ── Detail panel ─────────────────────────────────────────────────────────────
function renderDetail() {
  const el = document.getElementById('detail-panel');
  const f = state.selectedFinding;

  if (!f) {
    el.className = 'empty';
    el.innerHTML = '<span>' + t('clickFinding') + '</span>';
    return;
  }

  el.className = '';

  // Build tabs + two content panes
  let html = '';
  const detailActive = state.activeDetailTab === 'detail';
  html += `<div class="detail-tabs">`;
  html += `<button class="detail-tab${detailActive ? ' active' : ''}" data-tab="detail">${t('detail')}</button>`;
  html += `<button class="detail-tab${!detailActive ? ' active' : ''}" data-tab="source">${t('source')}</button>`;
  html += `</div>`;
  html += `<div id="detail-content" style="${detailActive ? '' : 'display:none'}">`;
  html += buildDetailHTML(f);
  html += `</div>`;
  html += `<div id="source-content" style="${detailActive ? 'display:none' : ''}">`;
  html += '<div class="loading-state">' + t('loadingSource') + '</div>';
  html += `</div>`;

  el.innerHTML = html;

  // Tab switching
  el.querySelectorAll('.detail-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      state.activeDetailTab = tab.dataset.tab;
      el.querySelectorAll('.detail-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.activeDetailTab));
      document.getElementById('detail-content').style.display = state.activeDetailTab === 'detail' ? '' : 'none';
      document.getElementById('source-content').style.display = state.activeDetailTab === 'source' ? '' : 'none';
      if (state.activeDetailTab === 'source') loadAndRenderSource(f);
    });
  });

  // If source tab is already active, load source
  if (!detailActive) loadAndRenderSource(f);

  // Allowlist submit handler
  const alBtn = document.getElementById('al-submit');
  if (alBtn) {
    alBtn.addEventListener('click', () => submitAllowlistEntry(f));
  }
}

const _CONF_LEVEL = { high: 3, medium: 2, low: 1 };
const _CONF_MAX = 3;

function renderConfidence(confValue) {
  const level = _CONF_LEVEL[(confValue || '').toLowerCase()] || 1;
  let html = '<span class="conf-blocks">';
  html += `<span class="conf-num">${level}</span>`;
  for (let i = 0; i < _CONF_MAX; i++) {
    html += `<span class="conf-block ${i < level ? 'filled' : 'empty'}"></span>`;
  }
  html += '</span>';
  return html;
}

function buildDetailHTML(f) {
  let html = '';
  // Header
  html += `<div class="detail-section">`;
  html += `<span class="sev-tag ${f.severity}">${f.severity}</span> `;
  html += `<strong>${esc(f.defect_id)}</strong> &middot; ${esc(f.defect_class)}`;
  html += `</div>`;

  // Metadata
  html += `<div class="detail-section"><h4>${t('metadata')}</h4>`;
  html += `<dl class="detail-meta">`;
  html += `<dt>${t('section')}</dt><dd>${esc(f.section_heading || t('none'))}</dd>`;
  if (f.line) html += `<dt>${t('line')}</dt><dd>${f.line}${f.col ? ':' + f.col : ''}</dd>`;
  html += `<dt>${t('confidence')}</dt><dd>${renderConfidence(f.confidence)}</dd>`;
  if (f.matched_term) html += `<dt>${t('term')}</dt><dd>${esc(f.matched_term)}</dd>`;
  if (f.term_category) html += `<dt>${t('category')}</dt><dd>${esc(f.term_category)}</dd>`;
  if (f.section_role) html += `<dt>${t('sectionRole')}</dt><dd>${esc(f.section_role)}</dd>`;
  if (f.llm_provider) html += `<dt>${t('llmLabel')}</dt><dd>${esc(f.llm_provider)}${f.llm_model ? ' / ' + esc(f.llm_model) : ''}</dd>`;
  if (f.llm_confidence_raw != null) html += `<dt>${t('llmConfidence')}</dt><dd>${(f.llm_confidence_raw * 100).toFixed(0)}%</dd>`;
  html += `</dl></div>`;

  // Evidence
  html += `<div class="detail-section"><h4>${t('evidence')}</h4>`;
  html += `<pre>${esc(f.evidence_text)}</pre></div>`;

  // Message
  html += `<div class="detail-section"><h4>${t('description')}</h4>`;
  html += `<p>${esc(f.message)}</p></div>`;

  // Remediation
  const remText = state.locale === 'ru'
    ? (f.remediation_ru || f.remediation_hint)
    : (f.remediation_en || f.remediation_hint);
  if (remText) {
    html += `<div class="detail-section"><h4>${t('remediation')}</h4>`;
    html += `<div class="remediation-box">${esc(remText)}</div></div>`;
  }

  // Allowlist section
  html += buildAllowlistHTML(f);

  return html;
}

function buildAllowlistHTML(f) {
  let html = '<div class="allowlist-section">';

  if (f._is_suppressed && f._allowlist_entry) {
    // ── Already suppressed: show read-only entry ──
    const e = f._allowlist_entry;
    html += `<h4>&#x2705; ${t('allowlisted')} <span class="scope-badge ${esc(e.scope)}">${esc(e.scope)}</span></h4>`;
    html += `<div class="al-form-group"><label>${t('term')}</label>`;
    html += `<input type="text" readonly value="${esc(e.term)}"></div>`;
    html += `<div class="al-form-group"><label>Defect ID</label>`;
    html += `<input type="text" readonly value="${esc(e.defect_id)}"></div>`;
    html += `<div class="al-form-group"><label>${t('reason')}</label>`;
    html += `<textarea readonly>${esc(e.reason)}</textarea></div>`;
    if (e.owner) {
      html += `<div class="al-form-group"><label>${t('owner')}</label>`;
      html += `<input type="text" readonly value="${esc(e.owner)}"></div>`;
    }
    if (e.expires) {
      html += `<div class="al-form-group"><label>${t('expires')}</label>`;
      html += `<input type="text" readonly value="${esc(e.expires)}"></div>`;
    }
    if (e.applies_to_section_roles && e.applies_to_section_roles.length > 0) {
      html += `<div class="al-form-group"><label>${t('sectionRoles')}</label>`;
      html += `<input type="text" readonly value="${esc(e.applies_to_section_roles.join(', '))}"></div>`;
    }
    html += `<div style="font-size:0.72rem;color:var(--pico-muted-color);margin-top:6px">Source: ${esc(e.source_file)}</div>`;
  } else {
    // ── Not suppressed: show editable form ──
    html += `<h4>&#x1F6E1; ${t('addToAllowlist')}</h4>`;
    html += `<div class="al-form-group"><label>${t('term')}</label>`;
    html += `<input type="text" readonly value="${esc(f.evidence_text)}"></div>`;
    html += `<div class="al-form-group"><label>Defect ID</label>`;
    html += `<input type="text" readonly value="${esc(f.defect_id)}"></div>`;
    html += `<div class="al-form-group"><label>${t('reason')} <span style="color:var(--sev-critical)">*</span></label>`;
    html += `<textarea id="al-reason" placeholder="${t('reasonPlaceholder')}"></textarea></div>`;
    html += `<div class="al-form-group"><label>${t('owner')}</label>`;
    html += `<input type="text" id="al-owner" placeholder="${t('ownerPlaceholder')}"></div>`;
    html += `<div class="al-form-group"><label>${t('expires')}</label>`;
    html += `<input type="date" id="al-expires"></div>`;
    html += `<button class="al-submit-btn" id="al-submit">${t('addToAllowlist')}</button>`;
    html += `<div class="al-status" id="al-status"></div>`;
  }

  html += '</div>';
  return html;
}

// ── Allowlist submit ──────────────────────────────────────────────────────────
async function submitAllowlistEntry(f) {
  const reason = (document.getElementById('al-reason')?.value || '').trim();
  const owner = (document.getElementById('al-owner')?.value || '').trim();
  const expires = (document.getElementById('al-expires')?.value || '').trim();
  const statusEl = document.getElementById('al-status');
  const btn = document.getElementById('al-submit');

  if (!reason) {
    if (statusEl) { statusEl.className = 'al-status error'; statusEl.textContent = t('reasonRequired'); }
    return;
  }

  const docPath = f.document_path || f._file_path;
  if (!docPath) {
    if (statusEl) { statusEl.className = 'al-status error'; statusEl.textContent = t('noDocPath'); }
    return;
  }

  const body = {
    doc_path: docPath,
    term: f.evidence_text,
    defect_id: f.defect_id,
    reason: reason,
  };
  if (owner) body.owner = owner;
  if (expires) body.expires = expires;
  if (f.section_role) body.section_roles = [f.section_role];

  btn.disabled = true;
  btn.textContent = t('saving');

  try {
    const res = await apiPost('/api/allowlist', body);
    // Mark finding as suppressed locally (instant visual feedback)
    f._is_suppressed = true;
    f._allowlist_entry = {
      term: f.evidence_text,
      defect_id: f.defect_id,
      reason: reason,
      owner: owner || null,
      expires: expires || null,
      scope: 'document',
      source_file: res.file || '',
      applies_to_section_roles: f.section_role ? [f.section_role] : [],
    };
    // Move finding into suppressed list in scan result
    if (state.scanResult) {
      for (const fr of state.scanResult.files) {
        const idx = fr.findings.indexOf(f);
        if (idx !== -1) {
          fr.findings.splice(idx, 1);
          if (!fr.suppressed) fr.suppressed = [];
          fr.suppressed.push({ finding: f, entry: f._allowlist_entry });
          fr.suppressed_count = fr.suppressed.length;
          break;
        }
      }
    }
    renderFindings();
    renderDetail();
    renderSummary();
  } catch (err) {
    if (statusEl) {
      statusEl.className = 'al-status error';
      statusEl.textContent = err.message;
    }
    btn.disabled = false;
    btn.textContent = t('addToAllowlist');
  }
}

// ── Source viewer ─────────────────────────────────────────────────────────────
async function fetchSource(filePath) {
  if (state.sourceTexts[filePath] !== undefined) return state.sourceTexts[filePath];
  try {
    const data = await apiGet('/api/source?path=' + encodeURIComponent(filePath));
    state.sourceTexts[filePath] = data.text;
    return data.text;
  } catch (e) {
    return null;
  }
}

async function loadAndRenderSource(f) {
  const container = document.getElementById('source-content');
  if (!container) return;

  // Find the file path for this finding (try document_path, then group-level _file_path)
  const filePath = f.document_path || f._file_path;
  if (!filePath) {
    container.innerHTML = '<div class="empty-state">' + t('noSourcePath') + '</div>';
    return;
  }

  let text = await fetchSource(filePath);
  // Fallback: try _file_path if document_path failed
  if (text === null && f._file_path && f._file_path !== filePath) {
    text = await fetchSource(f._file_path);
  }
  if (text === null) {
    container.innerHTML = `<div class="empty-state">${t('couldNotLoadSource')}<br><code>${esc(filePath)}</code></div>`;
    return;
  }

  const lines = text.split('\n');
  const absOffset = f.abs_offset;
  const evidenceLen = f.evidence_text ? f.evidence_text.length : 0;
  const highlightLine = f.line || 0;

  // Compute per-line char offsets for marking evidence
  let lineOffsets = []; // lineOffsets[i] = char offset where line i starts
  let off = 0;
  for (let i = 0; i < lines.length; i++) {
    lineOffsets.push(off);
    off += lines[i].length + 1; // +1 for \n
  }

  const evStart = absOffset != null ? absOffset : -1;
  const evEnd = evStart >= 0 ? evStart + evidenceLen : -1;

  const fname = filePath.split(/[\\/]/).pop();
  let html = `<div style="font-size:0.75rem;color:var(--pico-muted-color);margin-bottom:4px;word-break:break-all" title="${esc(filePath)}">${esc(fname)}</div>`;
  html += '<div class="source-viewer"><table>';
  for (let i = 0; i < lines.length; i++) {
    const lineStart = lineOffsets[i];
    const lineEnd = lineStart + lines[i].length;
    const isHighlight = (i + 1) === highlightLine;
    html += `<tr${isHighlight ? ' class="highlight-line"' : ''} data-line="${i+1}">`;
    html += `<td class="line-no">${i + 1}</td>`;

    // Check if evidence overlaps this line
    if (evStart >= 0 && evEnd > lineStart && evStart < lineEnd) {
      // Evidence overlaps this line — insert <mark>
      const markStart = Math.max(0, evStart - lineStart);
      const markEnd = Math.min(lines[i].length, evEnd - lineStart);
      const before = lines[i].slice(0, markStart);
      const marked = lines[i].slice(markStart, markEnd);
      const after = lines[i].slice(markEnd);
      html += `<td class="line-text">${esc(before)}<mark>${esc(marked)}</mark>${esc(after)}</td>`;
    } else {
      html += `<td class="line-text">${esc(lines[i])}</td>`;
    }
    html += `</tr>`;
  }
  html += '</table></div>';
  container.innerHTML = html;

  // Scroll to the highlighted line
  if (highlightLine > 0) {
    const row = container.querySelector(`tr[data-line="${highlightLine}"]`);
    if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

// ── Summary bar ──────────────────────────────────────────────────────────────
function renderSummary() {
  const el = document.getElementById('summary-bar');
  if (!state.scanResult) {
    el.textContent = t('selectAndScan');
    return;
  }
  const totals = state.scanResult.totals;
  const sevMap = { critical: 'summCritical', high: 'summHigh', medium: 'summMedium', low: 'summLow', info: 'summInfo' };
  const parts = [];
  for (const [sev, count] of Object.entries(totals.by_severity || {})) {
    if (count > 0) parts.push(`${count} ${t(sevMap[sev] || sev)}`);
  }
  const suppInfo = totals.suppressed > 0 ? ` \u00b7 ${totals.suppressed} ${t('suppressed').toLowerCase()}` : '';
  el.textContent = `${totals.total_findings} ${t('findings')} (${parts.join(', ')}) ${t('across')} ${totals.files} ${t('filesWord')}${suppInfo}`;
}

// ── Scan ─────────────────────────────────────────────────────────────────────
async function doScan() {
  const paths = Array.from(state.selectedFiles);
  if (paths.length === 0) {
    alert(t('selectAtLeastOne'));
    return;
  }

  const btn = document.getElementById('btn-scan');
  const listEl = document.getElementById('findings-list');
  btn.disabled = true;
  btn.textContent = t('scan') + '...';
  listEl.innerHTML = '<div class="loading-state">' + t('runningAudit') + '</div>';

  try {
    const result = await apiPost('/api/scan', {
      paths: paths,
      use_nlp: document.getElementById('toggle-nlp').checked,
      use_llm: document.getElementById('toggle-llm').checked,
    });
    state.scanResult = result;
    state.selectedFinding = null;

    // Update finding counts on tree
    state.findingCounts = {};
    for (const fr of result.files) {
      state.findingCounts[fr.path] = fr.findings.length;
    }
    // Show scan errors if any
    if (result.errors && result.errors.length > 0) {
      const errMsgs = result.errors.map(e => `${e.path}: ${e.error}`).join('\n');
      console.warn('Scan errors:', errMsgs);
    }
    renderFileTree();
    renderFindings();
    renderDetail();
    renderSummary();
  } catch (err) {
    listEl.innerHTML = `<div class="empty-state" style="color:var(--sev-critical)">${t('scanFailed')} ${esc(err.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = t('scan');
  }
}

// ── Export JSON ──────────────────────────────────────────────────────────────
function doExport() {
  if (!state.scanResult) {
    alert(t('nothingToExport'));
    return;
  }
  const blob = new Blob([JSON.stringify(state.scanResult, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kansanin_report.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  const div = document.createElement('div');
  div.textContent = String(s);
  return div.innerHTML;
}

function truncate(s, n) {
  if (!s) return '';
  return s.length > n ? s.slice(0, n) + '...' : s;
}

// ── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  // Load file tree
  try {
    const data = await apiGet('/api/files');
    state.fileTree = data.tree;
    state.rootDir = data.root;
    // Auto-select all files
    const allFiles = collectAllFiles(state.fileTree);
    allFiles.forEach(f => state.selectedFiles.add(f));
    renderFileTree();
  } catch (err) {
    document.getElementById('file-tree').innerHTML =
      `<div class="empty-state" style="color:var(--sev-critical)">${t('failedLoadFiles')} ${esc(err.message)}</div>`;
  }

  // Root label
  document.getElementById('root-label').title = state.rootDir;

  // Scan button
  document.getElementById('btn-scan').addEventListener('click', doScan);

  // Clear button
  document.getElementById('btn-clear').addEventListener('click', () => {
    state.scanResult = null;
    state.selectedFinding = null;
    state.findingCounts = {};
    state.sourceTexts = {};
    state.searchQuery = '';
    state.showSuppressed = false;
    document.getElementById('search-input').value = '';
    document.getElementById('toggle-suppressed').checked = false;
    state.activeSeverities = new Set(['critical', 'high', 'medium', 'low', 'info']);
    document.querySelectorAll('.sev-chip').forEach(c => c.classList.add('active'));
    renderFileTree();
    renderFindings();
    renderDetail();
    renderSummary();
  });

  // Export button
  document.getElementById('btn-export').addEventListener('click', doExport);

  // Change root directory
  document.getElementById('btn-change-root').addEventListener('click', async () => {
    const newRoot = prompt('Enter root directory path:', state.rootDir);
    if (!newRoot || newRoot === state.rootDir) return;
    try {
      const data = await apiGet('/api/files?root=' + encodeURIComponent(newRoot));
      state.fileTree = data.tree;
      state.rootDir = data.root;
      state.selectedFiles.clear();
      state.scanResult = null;
      state.selectedFinding = null;
      state.findingCounts = {};
      state.sourceTexts = {};
      const allFiles = collectAllFiles(state.fileTree);
      allFiles.forEach(f => state.selectedFiles.add(f));
      document.getElementById('root-label').title = state.rootDir;
      renderFileTree();
      renderFindings();
      renderDetail();
      renderSummary();
    } catch (err) {
      alert(t('failedLoadDir') + ' ' + err.message);
    }
  });

  // Select all / none
  document.getElementById('btn-select-all').addEventListener('click', () => {
    const allFiles = collectAllFiles(state.fileTree);
    allFiles.forEach(f => state.selectedFiles.add(f));
    renderFileTree();
  });
  document.getElementById('btn-select-none').addEventListener('click', () => {
    state.selectedFiles.clear();
    renderFileTree();
  });

  // Severity filters
  document.querySelectorAll('.sev-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const sev = chip.dataset.sev;
      if (state.activeSeverities.has(sev)) {
        state.activeSeverities.delete(sev);
        chip.classList.remove('active');
      } else {
        state.activeSeverities.add(sev);
        chip.classList.add('active');
      }
      renderFindings();
    });
  });

  // Search
  document.getElementById('search-input').addEventListener('input', (e) => {
    state.searchQuery = e.target.value;
    renderFindings();
  });

  // Suppressed toggle
  document.getElementById('toggle-suppressed').addEventListener('change', (e) => {
    state.showSuppressed = e.target.checked;
    renderFindings();
  });

  // Keyboard: Escape clears selection
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      state.selectedFinding = null;
      renderFindings();
      renderDetail();
    }
  });

  // ── Drag resize handles ──────────────────────────────────
  function setupResize(handleId, targetId, side) {
    const handle = document.getElementById(handleId);
    const target = document.getElementById(targetId);
    if (!handle || !target) return;

    let startX, startW;
    function onMouseMove(e) {
      const delta = e.clientX - startX;
      const newW = side === 'left' ? startW + delta : startW - delta;
      target.style.width = Math.max(150, newW) + 'px';
    }
    function onMouseUp() {
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      startX = e.clientX;
      startW = target.getBoundingClientRect().width;
      handle.classList.add('dragging');
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });
  }
  setupResize('resize-left', 'file-panel', 'left');
  setupResize('resize-right', 'detail-panel', 'right');

  // Set initial locale
  document.getElementById('locale-select').value = state.locale;
  // Apply locale to UI
  renderAll();
}

init();
</script>
