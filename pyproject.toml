[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kansanin"
version = "0.13.0"
description = "Static analysis for engineering specifications and ADRs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Barmagloth", email = "steex.nigatsu@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/Barmagloth/Kansanin"

[project.scripts]
kansanin = "doc_auditor.run_audit:main"

[tool.setuptools.packages.find]
include = ["doc_auditor*"]

[tool.setuptools.package-data]
doc_auditor = ["*.txt", "*.yaml"]
