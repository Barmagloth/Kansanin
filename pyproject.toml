[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kansanin"
version = "0.18.0"
description = "Static analysis for engineering specifications and ADRs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Barmagloth", email = "steex.nigatsu@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.7",
    "textstat>=0.7",
]
llm = [
    "openai>=1.0",
    "anthropic>=0.30",
]
llm-onnx = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]
llm-all = [
    "kansanin[nlp]",
    "kansanin[llm]",
    "kansanin[llm-onnx]",
]

[project.urls]
Repository = "https://github.com/Barmagloth/Kansanin"

[project.scripts]
kansanin = "kansanin.run_audit:main"

[tool.setuptools.packages.find]
include = ["kansanin*"]

[tool.setuptools.package-data]
kansanin = ["*.txt", "*.yaml", "llm/prompts/*.txt", "web/static/*.html"]
